<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>人情录</title>
    <script>
      /*
       * 前端由 Cloudflare Worker 直接托管（单域名），GitHub 仅托管代码。
       * 这里统一处理：
       *   1. 把前端发出的相对路径 api/... 规范为同源 /api/...；
       *   2. 身份模型：
       *      - 登录账号（手机号 + 密码，JWT 存 localStorage，7 天有效）→ 数据按手机号隔离，
       *        换浏览器/换设备登录同一手机号即看到同一本账；
       *      - 未登录的游客 → localStorage 匿名设备标识（X-Ledger-Token），
       *        数据归属 dev:<设备>，注册账号时自动并入账号；
       *      - 小程序/第三方客户端用接口密钥（X-Api-Key）访问同一账号。
       */
      (function () {
        var API_BASE = "";

        function newToken() {
          try {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
          } catch (e) {}
          var s = "";
          for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
          return s.slice(0, 8) + "-" + s.slice(8, 12) + "-" + s.slice(12, 16) + "-" + s.slice(16, 20) + "-" + s.slice(20, 32);
        }

        function ls() {
          try { return window.localStorage; } catch (e) { return null; }
        }

        function getToken() {
          var store = ls();
          if (store) {
            try {
              var t = store.getItem("ledger_device_token");
              if (t) return t;
              t = newToken();
              store.setItem("ledger_device_token", t);
              return t;
            } catch (e) {}
          }
          return window.__ledgerMemoryToken || (window.__ledgerMemoryToken = newToken());
        }

        // 登录态：JWT（手机号 + 密码账号，7 天有效）
        function getAuthJwt() {
          var s = ls();
          return s ? s.getItem("ledger_jwt") || "" : "";
        }
        function saveLogin(phone, name, jwt) {
          var s = ls();
          if (!s) return;
          s.setItem("ledger_phone", phone);
          s.setItem("ledger_name", name || "");
          s.setItem("ledger_jwt", jwt || "");
        }
        function clearLogin() {
          var s = ls();
          if (!s) return;
          s.removeItem("ledger_phone");
          s.removeItem("ledger_name");
          s.removeItem("ledger_jwt");
        }

        var originalFetch = window.fetch ? window.fetch.bind(window) : null;
        if (!originalFetch) return;

        /* ------------------------------------------------------------------ */
        /* AI 解析 429 兜底：浏览器直连                                          */
        /* Worker 出口 IP（Cloudflare）常被 AI 服务商限流；429 时后端把该账号的  */
        /* AI 配置放进 502 响应，前端用浏览器（用户本机 IP）直连模型重试。       */
        /* key 只出现在本人浏览器内存里，不经过本站其他逻辑。                   */
        /* ------------------------------------------------------------------ */
        function directAiParse(d) {
          var url = String(d.baseUrl || "").replace(/\/+$/, "");
          if (url.indexOf("/chat/completions") === -1) url += "/chat/completions";
          return originalFetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + d.apiKey },
            body: JSON.stringify({
              model: d.model,
              messages: [
                { role: "system", content: d.system },
                { role: "user", content: d.user },
              ],
              temperature: 0.2,
              stream: false,
            }),
            signal: AbortSignal.timeout ? AbortSignal.timeout(60000) : undefined,
          })
            .catch(function (e) {
              throw new Error("浏览器直连失败（该 AI 服务不允许本站跨域调用，或网络不通）：" + (e && e.message ? e.message : e));
            })
            .then(function (r) {
              if (!r.ok) {
                return r
                  .text()
                  .then(function (t) {
                    var extra = r.status === 429
                      ? "（429 与站点无关，来自你的 AI 账号配额/限流，请检查该账号的余额与限流策略）"
                      : "";
                    throw new Error("浏览器直连 AI 也失败（HTTP " + r.status + "）" + (t ? "：" + t.slice(0, 160) : "") + extra);
                  });
              }
              return r.json();
            })
            .then(function (data) {
              var choice = data && data.choices && data.choices[0];
              var content = choice && choice.message ? choice.message.content : "";
              if (Array.isArray(content)) {
                content = content.map(function (p) { return typeof p === "string" ? p : (p && p.text) || ""; }).join("");
              }
              content = String(content || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
              var parsed = JSON.parse(content);
              // 轻量归一化，与后端 normalizeAiRecords 对齐
              var records = [];
              var errors = [];
              var today = new Date().toISOString().slice(0, 10);
              var ETYPES = { wedding: 1, baby: 1, birthday: 1, housewarming: 1, graduation: 1, funeral: 1, other: 1 };
              var RELS = { "朋友": 1, "亲戚": 1, "同事": 1, "同学": 1, "邻居": 1, "其他": 1 };
              (Array.isArray(parsed.records) ? parsed.records : []).forEach(function (raw) {
                if (!raw || typeof raw !== "object") return;
                var person = String(raw.person || "").trim().slice(0, 80);
                if (!person) { errors.push("有一条记录缺少姓名，已跳过"); return; }
                var direction = raw.direction === "in" || raw.direction === "out" ? raw.direction : null;
                if (!direction) { errors.push("「" + person + "」的收支方向无法识别，已跳过"); return; }
                var amount = Number(String(raw.amountYuan || "").replace(/[^\d.]/g, ""));
                if (!Number.isFinite(amount) || amount <= 0) { errors.push("「" + person + "」的金额无法识别，已跳过"); return; }
                var rel = String(raw.relation || "").trim();
                var dt = String(raw.date || "");
                records.push({
                  direction: direction,
                  person: person,
                  relation: RELS[rel] ? rel : "朋友",
                  amountYuan: amount.toFixed(2).replace(/\.00$/, ""),
                  eventType: ETYPES[raw.eventType] ? raw.eventType : "other",
                  date: /^\d{4}-\d{2}-\d{2}$/.test(dt) ? dt : today,
                  note: String(raw.note || "").slice(0, 500).trim(),
                });
              });
              (Array.isArray(parsed.errors) ? parsed.errors : []).forEach(function (m) {
                var s = String(m || "").trim().slice(0, 300);
                if (s) errors.push(s);
              });
              if (!records.length && !errors.length) errors.push("没有解析出记录，换个说法试试");
              return { records: records, errors: errors };
            });
        }

        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input && input.url ? input.url : String(input);
          var nextInput = input;
          if (/^(\.?\/?api\/)/.test(url)) {
            nextInput = API_BASE + "/api/" + url.replace(/^\.?\/?api\//, "");
          }
          var nextInit = {};
          if (init) {
            for (var k in init) if (Object.prototype.hasOwnProperty.call(init, k)) nextInit[k] = init[k];
          }
          try {
            var baseHeaders = init && init.headers ? init.headers : input instanceof Request ? input.headers : undefined;
            var headers = new Headers(baseHeaders || undefined);
            headers.set("X-Ledger-Token", getToken());
            var jwt = getAuthJwt();
            if (jwt) headers.set("Authorization", "Bearer " + jwt);
            nextInit.headers = headers;
          } catch (e) {}
          var p = originalFetch(nextInput, nextInit);
          // 仅对 AI 解析请求做 429 → 浏览器直连兜底
          if (String(nextInput).indexOf("/api/ai/parse") !== -1) {
            return p.then(function (r) {
              if (r.status !== 502) return r;
              return r
                .clone()
                .json()
                .then(function (data) {
                  if (!data || !data.direct || String(data.error || "").indexOf("429") === -1) return r;
                  return directAiParse(data.direct)
                    .then(function (normalized) {
                      return new Response(JSON.stringify(normalized), {
                        status: 200,
                        headers: { "Content-Type": "application/json; charset=utf-8" },
                      });
                    })
                    .catch(function (directErr) {
                      // 浏览器直连也失败：给出比原始 502 更有用的诊断
                      var detail = directErr && directErr.message ? directErr.message : String(directErr);
                      return new Response(
                        JSON.stringify({ error: "已尝试浏览器直连（本机 IP）仍失败：" + detail }),
                        { status: 502, headers: { "Content-Type": "application/json; charset=utf-8" } }
                      );
                    });
                })
                .catch(function () {
                  return r;
                });
            });
          }
          return p;
        };

        /* ------------------------------------------------------------------ */
        /* 登录 / 注册界面（手机号 + 密码，JWT，跨设备同一本账）                 */
        /* ------------------------------------------------------------------ */
        function apiCall(path, method, body) {
          return fetch(API_BASE + path, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: body ? JSON.stringify(body) : undefined,
          }).then(function (r) {
            return r.json().then(function (d) {
              if (!r.ok) {
                var err = new Error(d.error || "请求失败(" + r.status + ")");
                err.status = r.status;
                throw err;
              }
              return d;
            });
          });
        }

        function buildAuthUI() {
          var style = document.createElement("style");
          style.textContent =
            ".lg-overlay{position:fixed;inset:0;background:rgba(28,24,20,.55);backdrop-filter:blur(2px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}" +
            ".lg-card{background:#fff;width:100%;max-width:360px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:24px 22px;font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#2b2622;font-size:14px}" +
            ".lg-card h2{margin:0 0 4px;font-size:18px;font-weight:600}" +
            ".lg-sub{color:#8a8178;margin:0 0 16px;font-size:13px;line-height:1.6}" +
            ".lg-tabs{display:flex;background:#f3efe9;border-radius:10px;padding:3px;margin-bottom:14px}" +
            ".lg-tab{flex:1;text-align:center;padding:7px 0;border-radius:8px;cursor:pointer;color:#8a8178;font-size:13px;user-select:none}" +
            ".lg-tab.on{background:#fff;color:#2b2622;box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}" +
            ".lg-field{margin-bottom:10px}" +
            ".lg-field label{display:block;font-size:12px;color:#8a8178;margin-bottom:4px}" +
            ".lg-field input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid #e5ddd3;border-radius:9px;font-size:15px;outline:none}" +
            ".lg-field input:focus{border-color:#c9a86a}" +
            ".lg-btn{width:100%;padding:10px 0;background:#8c6d4f;color:#fff;border:none;border-radius:9px;font-size:14px;cursor:pointer;margin-top:6px}" +
            ".lg-btn:disabled{opacity:.6;cursor:default}" +
            ".lg-btn.ghost{background:transparent;color:#8c6d4f;margin-top:8px}" +
            ".lg-msg{font-size:12px;margin-top:10px;min-height:16px;line-height:1.5}" +
            ".lg-msg.err{color:#c0392b}.lg-msg.ok{color:#2e7d32}.lg-msg.warn{color:#9a7b00}" +
            ".lg-links{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#8a8178}" +
            ".lg-links a{color:#8c6d4f;text-decoration:none;cursor:pointer}";
          document.head.appendChild(style);

          var overlay = document.createElement("div");
          overlay.className = "lg-overlay";
          overlay.style.display = "none";
          overlay.innerHTML =
            '<div class="lg-card">' +
            '<h2 id="lg-title">登录</h2>' +
            '<p class="lg-sub" id="lg-sub">输入手机号和密码，在任意设备登录同一账号看同一本账。</p>' +
            '<div class="lg-tabs"><div class="lg-tab on" id="tab-login">登录</div><div class="lg-tab" id="tab-reg">注册</div></div>' +
            '<div class="lg-field" id="f-name" style="display:none"><label>昵称（可选）</label><input id="i-name" maxlength="32" placeholder="显示在账本里的名字" autocomplete="off"></div>' +
            '<div class="lg-field" id="f-phone"><label>手机号</label><input id="i-phone" inputmode="numeric" maxlength="20" placeholder="11 位手机号" autocomplete="off"></div>' +
            '<div class="lg-field" id="f-password"><label>密码（8-32 位）</label><input id="i-password" type="password" maxlength="32" placeholder="登录密码" autocomplete="off"></div>' +
            '<div class="lg-field" id="f-password2" style="display:none"><label>确认密码</label><input id="i-password2" type="password" maxlength="32" placeholder="再输入一次密码" autocomplete="off"></div>' +
            '<label id="f-merge" style="display:none;font-size:12px;color:#8a8178;margin-bottom:8px;cursor:pointer"><input id="i-merge" type="checkbox" checked style="vertical-align:middle"> 把本浏览器已有的账本数据并入该账号</label>' +
            '<button class="lg-btn" id="lg-go">登录</button>' +
            '<button class="lg-btn ghost" id="lg-guest" style="display:none">先以访客身份使用</button>' +
            '<div class="lg-msg" id="lg-msg"></div>' +
            '<div class="lg-links" id="lg-links"><a id="lg-forgot">忘记密码？</a><a id="lg-unbind" style="display:none;color:#c0392b">退出登录</a></div>' +
            "</div>";
          document.body.appendChild(overlay);

          var $ = function (id) { return overlay.querySelector(id); };
          var mode = "login";

          function msg(text, cls) {
            var m = $("#lg-msg");
            m.textContent = text || "";
            m.className = "lg-msg" + (cls ? " " + cls : "");
          }

          function setMode(m) {
            mode = m;
            var tabs = [$("#tab-login"), $("#tab-reg")];
            tabs.forEach(function (t) { t.classList.remove("on"); });
            $("#tab-login").classList.toggle("on", m === "login");
            $("#tab-reg").classList.toggle("on", m === "reg");

            var isReg = m === "reg";
            $("#lg-title").textContent = isReg ? "注册账号" : "登录";
            $("#lg-sub").textContent = isReg
              ? "手机号 + 密码即账号。注册后任意设备登录同一账号看同一本账；本浏览器已有数据会自动并入。"
              : "输入手机号和密码，在任意设备登录同一账号看同一本账。";
            $("#f-name").style.display = isReg ? "" : "none";
            $("#f-password2").style.display = isReg ? "" : "none";
            $("#f-merge").style.display = isReg ? "" : "none";
            $("#i-password").placeholder = isReg ? "设置密码（8-32 位）" : "登录密码";
            $("#lg-go").textContent = isReg ? "注册并登录" : "登录";
            $("#lg-guest").style.display = isReg ? "" : "none";
            msg("");
          }

          $("#tab-login").onclick = function () { setMode("login"); };
          $("#tab-reg").onclick = function () { setMode("reg"); };
          $("#lg-forgot").onclick = function () {
            msg("忘记密码请联系管理员重置（管理员可用 /api/admin/reset-password 处理）。", "warn");
          };

          // 设置页「账户」面板的入口：
          // 未登录 → 打开注册；已登录 → 打开账号管理面板（切换 / 退出）
          var openAccountPanel = function () {
            var hasLogin = Boolean(getAuthJwt());
            if (hasLogin) {
              setMode("login");
              $("#i-phone").value = ls().getItem("ledger_phone") || "";
              $("#i-password").value = "";
              $("#i-password").placeholder = "登录密码";
              $("#lg-unbind").style.display = "";
            } else {
              setMode("reg");
              $("#lg-unbind").style.display = "none";
            }
            $("#lg-go").textContent = hasLogin ? "登录 / 切换账号" : "注册并登录";
            msg("");
            overlay.style.display = "flex";
          };

          // 点击遮罩空白处关闭面板
          document.addEventListener("click", function (ev) {
            if (ev.target === overlay && overlay.style.display === "flex") {
              overlay.style.display = "none";
            }
          });

          // 退出登录：清除本地 JWT（服务端账号数据不受影响，重新登录即可恢复）
          $("#lg-unbind").onclick = function () {
            clearLogin();
            location.reload();
          };

          $("#lg-guest").onclick = function () {
            overlay.style.display = "none";
            location.reload();
          };

          $("#lg-go").onclick = function () {
            var phone = $("#i-phone").value.trim();
            var password = $("#i-password").value;
            var busy = function () { $("#lg-go").disabled = true; };
            var done = function () { $("#lg-go").disabled = false; };
            msg("");

            if (mode === "reg") {
              var name = $("#i-name").value.trim();
              var password2 = $("#i-password2").value;
              if (!/^\d{5,20}$/.test(phone)) return msg("请输入正确的手机号", "err");
              if (!password || password.length < 8 || password.length > 32) return msg("密码需为 8-32 位", "err");
              if (password !== password2) return msg("两次密码不一致", "err");
              busy();
              apiCall("/api/account/register", "POST", {
                phone: phone,
                name: name,
                password: password,
                importDevice: $("#i-merge").checked,
              })
                .then(function (d) {
                  saveLogin(phone, d.name || name, d.token);
                  location.reload();
                })
                .catch(function (e) {
                  done();
                  if (e.status === 409) return msg(e.message + "（可点「登录」）", "err");
                  msg(e.message, "err");
                });
              return;
            }

            // 登录
            if (!/^\d{5,20}$/.test(phone) || !password) {
              return msg("请输入手机号和密码", "err");
            }
            busy();
            apiCall("/api/account/login", "POST", { phone: phone, password: password })
              .then(function (d) {
                saveLogin(phone, d.name, d.token);
                location.reload();
              })
              .catch(function (e) {
                done();
                if (e.status === 404) return msg(e.message + "（点上方「注册」）", "err");
                if (e.status === 429) return msg(e.message, "warn");
                msg(e.message, "err");
              });
          };

          // Web 部署说明：在设置页「账户」面板注入「绑定手机号 / 账号管理」入口。
          // 说明：设置页的「运行模式/云端服务/接口密钥」等文案已在前端构建产物中
          // 静态修正（www/assets/index-*.js），并由 /api/session 返回 mode:'gateway'
          // 驱动面板原生渲染，此处不再做运行时文案修补，只保留功能性按钮注入。
          injectLedgerPanel(openAccountPanel);
        }

        function injectLedgerPanel(openPanel) {
          function textOf(el) {
            return el ? (el.textContent || "").trim() : "";
          }

          // 实时登录态（不能引用 buildAuthUI 里的局部变量，跨函数作用域不可见）
          function isLogged() {
            return Boolean(getAuthJwt());
          }

          // 找到「身份与运行状态」所在 section（设置页）
          function findAccountSec() {
            var dts = document.querySelectorAll("dt");
            for (var i = 0; i < dts.length; i++) {
              if (textOf(dts[i]) === "运行模式") return dts[i].closest("section, .panel");
            }
            return null;
          }

          // 把「绑定手机号 / 账号管理」按钮挂进「账户」面板。
          // React 每次重渲染都会重建 section DOM，注入的按钮会被顶掉——
          // 这里是幂等的：按钮在、文案没变就不动；被顶掉就立刻补回。
          function mountButton() {
            var sec = findAccountSec();
            if (!sec) return;
            var btn = document.getElementById("__bindPhone");
            var label = isLogged() ? "账号管理（切换 / 退出）" : "绑定手机号（登录 / 注册）";
            if (btn && btn.parentNode === sec && btn.textContent === label) return;
            if (!btn) {
              btn = document.createElement("button");
              btn.id = "__bindPhone";
              btn.className = "button";
              btn.style.cssText = "width:100%;margin-top:10px;justify-content:center;height:38px;font-size:13px";
              btn.onclick = openPanel;
            }
            btn.textContent = label;
            sec.appendChild(btn);
          }

          // 常驻挂载：React 重渲染（路由切换等）会重建设置页 DOM，
          // 每次 DOM 变化都幂等检查一遍；不在设置页时查不到目标元素，开销可忽略。
          var mo = new MutationObserver(mountButton);
          var appRoot = document.getElementById("root") || document.body;
          mo.observe(appRoot, { childList: true, subtree: true });

          var start = function () {
            mountButton();
            // 定时兜底（防 observer 漏报或首渲染竞态；幂等检查）
            setInterval(mountButton, 1500);
          };

          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", start);
          } else {
            start();
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", buildAuthUI);
        } else {
          buildAuthUI();
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CHaro1Qz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-0wU_Pyvo.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
