<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>人情录</title>
    <script>
      /*
       * 前端由 Cloudflare Worker 直接托管（单域名），GitHub 仅托管代码。
       * 这里统一处理：
       *   1. 把前端发出的相对路径 api/... 规范为同源 /api/...；
       *   2. 身份模型：
       *      - 登录手机号账号（localStorage 存 phone+pin）→ 所有数据按手机号隔离，
       *        换浏览器/换设备登录同一手机号即看到同一本账；
       *      - 未登录的游客 → localStorage 匿名设备标识（X-Ledger-Token），
       *        数据归属 dev:<设备>，注册手机号时可一键并入账号；
       *      - 小程序/第三方客户端用接口密钥（X-Api-Key）访问同一账号。
       */
      (function () {
        var API_BASE = "";

        function newToken() {
          try {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
          } catch (e) {}
          var s = "";
          for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
          return s.slice(0, 8) + "-" + s.slice(8, 12) + "-" + s.slice(12, 16) + "-" + s.slice(16, 20) + "-" + s.slice(20, 32);
        }

        function ls() {
          try { return window.localStorage; } catch (e) { return null; }
        }

        function getToken() {
          var store = ls();
          if (store) {
            try {
              var t = store.getItem("ledger_device_token");
              if (t) return t;
              t = newToken();
              store.setItem("ledger_device_token", t);
              return t;
            } catch (e) {}
          }
          return window.__ledgerMemoryToken || (window.__ledgerMemoryToken = newToken());
        }

        function getLoginPhone() {
          var s = ls();
          return s ? s.getItem("ledger_phone") || "" : "";
        }
        function getLoginPin() {
          var s = ls();
          return s ? s.getItem("ledger_pin") || "" : "";
        }
        function saveLogin(phone, pin) {
          var s = ls();
          if (!s) return;
          s.setItem("ledger_phone", phone);
          s.setItem("ledger_pin", pin);
        }
        function clearLogin() {
          var s = ls();
          if (!s) return;
          s.removeItem("ledger_phone");
          s.removeItem("ledger_pin");
        }

        var originalFetch = window.fetch ? window.fetch.bind(window) : null;
        if (!originalFetch) return;

        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input && input.url ? input.url : String(input);
          var nextInput = input;
          if (/^(\.?\/?api\/)/.test(url)) {
            nextInput = API_BASE + "/api/" + url.replace(/^\.?\/?api\//, "");
          }
          var nextInit = {};
          if (init) {
            for (var k in init) if (Object.prototype.hasOwnProperty.call(init, k)) nextInit[k] = init[k];
          }
          try {
            var baseHeaders = init && init.headers ? init.headers : input instanceof Request ? input.headers : undefined;
            var headers = new Headers(baseHeaders || undefined);
            headers.set("X-Ledger-Token", getToken());
            var phone = getLoginPhone();
            var pin = getLoginPin();
            if (phone && pin) {
              headers.set("X-Ledger-Phone", phone);
              headers.set("X-Ledger-Pin", pin);
            }
            nextInit.headers = headers;
          } catch (e) {}
          return originalFetch(nextInput, nextInit);
        };

        /* ------------------------------------------------------------------ */
        /* 登录 / 注册界面（手机号 + PIN，跨设备同一本账）                     */
        /* ------------------------------------------------------------------ */
        function maskPhone(p) {
          return p && p.length >= 7 ? p.slice(0, 3) + "****" + p.slice(-4) : p || "";
        }

        function apiCall(path, method, body) {
          return fetch(API_BASE + path, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: body ? JSON.stringify(body) : undefined,
          }).then(function (r) {
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(d.error || "请求失败(" + r.status + ")");
              return d;
            });
          });
        }

        function buildAuthUI() {
          var logged = getLoginPhone() && getLoginPin();
          var style = document.createElement("style");
          style.textContent =
            ".lg-overlay{position:fixed;inset:0;background:rgba(28,24,20,.55);backdrop-filter:blur(2px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}" +
            ".lg-card{background:#fff;width:100%;max-width:360px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:24px 22px;font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#2b2622;font-size:14px}" +
            ".lg-card h2{margin:0 0 4px;font-size:18px;font-weight:600}" +
            ".lg-sub{color:#8a8178;margin:0 0 16px;font-size:13px;line-height:1.6}" +
            ".lg-tabs{display:flex;background:#f3efe9;border-radius:10px;padding:3px;margin-bottom:14px}" +
            ".lg-tab{flex:1;text-align:center;padding:7px 0;border-radius:8px;cursor:pointer;color:#8a8178;font-size:13px;user-select:none}" +
            ".lg-tab.on{background:#fff;color:#2b2622;box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}" +
            ".lg-field{margin-bottom:10px}" +
            ".lg-field label{display:block;font-size:12px;color:#8a8178;margin-bottom:4px}" +
            ".lg-field input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid #e5ddd3;border-radius:9px;font-size:15px;outline:none}" +
            ".lg-field input:focus{border-color:#c9a86a}" +
            ".lg-btn{width:100%;padding:10px 0;background:#8c6d4f;color:#fff;border:none;border-radius:9px;font-size:14px;cursor:pointer;margin-top:6px}" +
            ".lg-btn:disabled{opacity:.6;cursor:default}" +
            ".lg-btn.ghost{background:transparent;color:#8c6d4f;margin-top:8px}" +
            ".lg-msg{font-size:12px;margin-top:10px;min-height:16px;line-height:1.5}" +
            ".lg-msg.err{color:#c0392b}.lg-msg.ok{color:#2e7d32}.lg-msg.warn{color:#9a7b00}" +
            ".lg-rec{background:#fdf6e7;border:1px solid #ecd9a8;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.6;display:none}" +
            ".lg-rec b{letter-spacing:2px;font-size:15px}" +
            ".lg-links{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#8a8178}" +
            ".lg-links a{color:#8c6d4f;text-decoration:none;cursor:pointer}";
          document.head.appendChild(style);

          var overlay = document.createElement("div");
          overlay.className = "lg-overlay";
          overlay.style.display = "none";
          overlay.innerHTML =
            '<div class="lg-card">' +
            '<h2 id="lg-title">登录</h2>' +
            '<p class="lg-sub" id="lg-sub">输入手机号和 PIN，在任意浏览器、任意设备查看同一本账。</p>' +
            '<div class="lg-tabs"><div class="lg-tab on" id="tab-login">登录</div><div class="lg-tab" id="tab-reg">注册</div><div class="lg-tab" id="tab-reset">找回 PIN</div></div>' +
            '<div class="lg-field" id="f-phone"><label>手机号</label><input id="i-phone" inputmode="numeric" maxlength="20" placeholder="11 位手机号" autocomplete="off"></div>' +
            '<div class="lg-field" id="f-pin"><label>PIN（4-16 位数字）</label><input id="i-pin" inputmode="numeric" maxlength="16" placeholder="登录 PIN" autocomplete="off"></div>' +
            '<div class="lg-field" id="f-pin2" style="display:none"><label>确认 PIN</label><input id="i-pin2" inputmode="numeric" maxlength="16" placeholder="再输入一次 PIN" autocomplete="off"></div>' +
            '<div class="lg-field" id="f-recode" style="display:none"><label>恢复码（注册时展示 8 位）</label><input id="i-recode" maxlength="8" placeholder="如 3CD9AF5A"></div>' +
            '<div class="lg-field" id="f-newpin" style="display:none"><label>新 PIN（4-16 位数字）</label><input id="i-newpin" inputmode="numeric" maxlength="16" placeholder="设置新 PIN"></div>' +
            '<label id="f-merge" style="display:none;font-size:12px;color:#8a8178;margin-bottom:8px;cursor:pointer"><input id="i-merge" type="checkbox" checked style="vertical-align:middle"> 把本浏览器已有的账本数据并入手机号账号</label>' +
            '<button class="lg-btn" id="lg-go">登录</button>' +
            '<button class="lg-btn ghost" id="lg-guest" style="display:none">先以访客身份使用</button>' +
            '<div class="lg-rec" id="lg-rec"><div style="margin-bottom:4px">请保存好恢复码（忘记 PIN 时用它找回账号）：</div><b id="lg-rec-code"></b></div>' +
            '<div class="lg-msg" id="lg-msg"></div>' +
            '<div class="lg-links" id="lg-links"><a id="lg-forgot">忘记 PIN？</a><a id="lg-unbind" style="display:none;color:#c0392b">解除本机登录</a></div>' +
            "</div>";
          document.body.appendChild(overlay);

          var $ = function (id) { return overlay.querySelector(id); };
          var mode = "login";

          function msg(text, cls) {
            var m = $("#lg-msg");
            m.textContent = text || "";
            m.className = "lg-msg" + (cls ? " " + cls : "");
          }

          function setMode(m) {
            mode = m;
            var tabs = [$("#tab-login"), $("#tab-reg"), $("#tab-reset")];
            tabs.forEach(function (t) { t.classList.remove("on"); });
            $("#tab-login").classList.toggle("on", m === "login");
            $("#tab-reg").classList.toggle("on", m === "reg");
            $("#tab-reset").classList.toggle("on", m === "reset");

            var isReg = m === "reg";
            var isReset = m === "reset";
            $("#lg-title").textContent = isReg ? "注册账号" : isReset ? "找回 PIN" : "登录";
            $("#lg-sub").textContent = isReg
              ? "手机号 + PIN 即账号。注册后换任何浏览器、任何设备登录同一手机号，都是同一本账。"
              : isReset
                ? "输入恢复码和新 PIN，即可重置登录 PIN。"
                : "输入手机号和 PIN，在任意浏览器、任意设备查看同一本账。";
            $("#f-pin2").style.display = isReg ? "" : "none";
            $("#f-recode").style.display = isReset ? "" : "none";
            $("#f-newpin").style.display = isReset ? "" : "none";
            $("#f-merge").style.display = isReg ? "" : "none";
            $("#i-pin").placeholder = isReg ? "设置 PIN（4-16 位数字）" : "登录 PIN";
            $("#lg-go").textContent = isReg ? "注册并登录" : isReset ? "重置 PIN" : "登录";
            $("#lg-guest").style.display = isReg ? "" : "none";
            msg("");
          }

          $("#tab-login").onclick = function () { setMode("login"); };
          $("#tab-reg").onclick = function () { setMode("reg"); };
          $("#tab-reset").onclick = function () { setMode("reset"); };
          $("#lg-forgot").onclick = function () { setMode("reset"); };

          // 设置页「账户」面板的入口（替代原悬浮按钮）：
          // 未登录 → 打开注册；已登录 → 打开账号管理面板（换手机号 / 退出）
          var openAccountPanel = function () {
            var hasLogin = getLoginPhone() && getLoginPin();
            if (hasLogin) {
              setMode("login");
              $("#i-phone").value = getLoginPhone();
              $("#i-pin").value = "";
              $("#i-pin").placeholder = "登录 PIN";
              $("#lg-unbind").style.display = "";
            } else {
              setMode("reg");
              $("#lg-unbind").style.display = "none";
            }
            var go = $("#lg-go");
            delete go.dataset.done;
            go.textContent = hasLogin ? "登录 / 切换账号" : "注册并登录";
            msg("");
            overlay.style.display = "flex";
          };

          // 点击遮罩空白处关闭面板
          document.addEventListener("click", function (ev) {
            if (ev.target === overlay && overlay.style.display === "flex") {
              overlay.style.display = "none";
            }
          });

          // 退出登录 / 切换账号：解除本机设备绑定（服务端不再记住本设备）并清除本地登录
          $("#lg-unbind").onclick = function () {
            apiCall("/api/account/device", "DELETE")
              .catch(function () { /* 游客无账号，本地清除即可 */ })
              .then(function () {
                clearLogin();
                location.reload();
              });
          };

          $("#lg-guest").onclick = function () {
            overlay.style.display = "none";
            location.reload();
          };

          $("#lg-go").onclick = function () {
            var phone = $("#i-phone").value.trim();
            var pin = $("#i-pin").value.trim();
            var busy = function () { $("#lg-go").disabled = true; };
            var done = function () { $("#lg-go").disabled = false; };
            msg("");

            // 注册成功展示恢复码后的「完成」
            if ($("#lg-go").dataset.done) {
              location.reload();
              return;
            }

            if (mode === "reg") {
              var pin2 = $("#i-pin2").value.trim();
              if (!/^\d{5,20}$/.test(phone)) return msg("请输入正确的手机号", "err");
              if (!/^\d{4,16}$/.test(pin)) return msg("PIN 需为 4-16 位数字", "err");
              if (pin !== pin2) return msg("两次 PIN 不一致", "err");
              busy();
              apiCall("/api/account/register", "POST", {
                phone: phone,
                pin: pin,
                importDevice: $("#i-merge").checked,
              })
                .then(function (d) {
                  saveLogin(phone, pin);
                  if (d.recoveryCode) {
                    $("#lg-rec").style.display = "";
                    $("#lg-rec-code").textContent = d.recoveryCode;
                    msg(d.hint || "注册成功", "ok");
                    $("#lg-go").textContent = "完成，进入账本";
                    $("#lg-go").dataset.done = "1";
                  } else {
                    done();
                    location.reload();
                  }
                })
                .catch(function (e) {
                  done();
                  msg(e.message + (e.message === "该手机号已注册，请直接登录" ? "（可点「登录」）" : ""), "err");
                });
              return;
            }

            if (mode === "reset") {
              var rec = $("#i-recode").value.trim();
              var newPin = $("#i-newpin").value.trim();
              if (!/^\d{5,20}$/.test(phone)) return msg("请输入正确的手机号", "err");
              if (!/^\d{4,16}$/.test(newPin)) return msg("新 PIN 需为 4-16 位数字", "err");
              busy();
              apiCall("/api/account/reset", "POST", { phone: phone, recovery: rec, pin: newPin })
                .then(function () {
                  saveLogin(phone, newPin);
                  location.reload();
                })
                .catch(function (e) {
                  done();
                  msg(e.message, "err");
                });
              return;
            }

            // 登录
            if (!/^\d{5,20}$/.test(phone) || !/^\d{4,16}$/.test(pin)) {
              return msg("请输入手机号和 PIN", "err");
            }
            busy();
            apiCall("/api/account/login", "POST", { phone: phone, pin: pin })
              .then(function () {
                saveLogin(phone, pin);
                location.reload();
              })
              .catch(function (e) {
                done();
                msg(
                  e.message +
                    (e.message === "该手机号未注册，请切换到注册" ? "（点上方「注册」）" : ""),
                  "err"
                );
              });
          };

          // Web 部署说明：在设置页「账户」面板注入「绑定手机号 / 账号管理」入口，
          // 并修正设置页残留的旧 NAS/网关文案
          injectLedgerPanel(openAccountPanel);
        }

        function injectLedgerPanel(openPanel) {
          function textOf(el) {
            return el ? (el.textContent || "").trim() : "";
          }

          // 实时登录态（不依赖 buildAuthUI 的局部变量）
          function isLogged() {
            return Boolean(getLoginPhone() && getLoginPin());
          }

          // 找到「身份与运行状态」所在 section（设置页）
          function findAccountSec() {
            var dts = document.querySelectorAll("dt");
            for (var i = 0; i < dts.length; i++) {
              if (textOf(dts[i]) === "运行模式") return dts[i].closest("section, .panel");
            }
            return null;
          }

          // 把「绑定手机号 / 账号管理」按钮挂进「账户」面板。
          // React 每次重渲染都会重建 section DOM，注入的按钮会被顶掉——
          // 这里是幂等的：按钮在、文案没变就不动；被顶掉就立刻补回。
          function mountButton() {
            var sec = findAccountSec();
            if (!sec) return;
            var btn = document.getElementById("__bindPhone");
            var label = isLogged() ? "账号管理（切换 / 退出）" : "绑定手机号（登录 / 注册）";
            if (btn && btn.parentNode === sec && btn.textContent === label) return;
            if (!btn) {
              btn = document.createElement("button");
              btn.id = "__bindPhone";
              btn.className = "button";
              btn.style.cssText = "width:100%;margin-top:10px;justify-content:center;height:38px;font-size:13px";
              btn.onclick = openPanel;
            }
            btn.textContent = label;
            sec.appendChild(btn);
          }

          // 修正「身份与运行状态」面板里残留的 NAS/网关文案（幂等）
          function patchAccountText() {
            var sec = findAccountSec();
            if (!sec) return;
            if (!sec.dataset.ledgerPatched) {
              sec.dataset.ledgerPatched = "1";
              var dds = sec.querySelectorAll("dd");
              if (isLogged() && dds[0]) dds[0].textContent = maskPhone(getLoginPhone());
              if (dds[1]) dds[1].textContent = "云端（Cloudflare Worker + D1）";
              if (dds[2]) dds[2].textContent = "数据存储于 Cloudflare D1（随本仓库部署，无需 NAS）";
              var dl = sec.querySelector("dl");
              if (dl && dl.getAttribute("data-ledger-rows") !== "1") {
                dl.setAttribute("data-ledger-rows", "1");
                var addRow = function (k, v) {
                  var row = document.createElement("div");
                  var dt = document.createElement("dt");
                  dt.textContent = k;
                  var dd = document.createElement("dd");
                  dd.textContent = v;
                  row.appendChild(dt);
                  row.appendChild(dd);
                  dl.appendChild(row);
                };
                addRow("运行状态", "在线（/api/health）");
                addRow("数据隔离", isLogged() ? "按手机号账号隔离，跨设备同步" : "游客模式：按浏览器设备隔离，绑定手机号后跨设备同步");
              }
            }
            // 未登录时 React 会把首行重置为「访客」，检测并改回
            if (!isLogged()) {
              var d0 = sec.querySelector("dd");
              if (d0 && d0.textContent.trim() === "访客") d0.textContent = "访客（未绑定手机号）";
            }
          }

          // 修正「接口密钥」面板里残留的 NAS 文案（只改文本节点，保留动态端口）
          function patchKeyText() {
            var subs = document.querySelectorAll(".panel-sub");
            for (var j = 0; j < subs.length; j++) {
              var nodes = subs[j].childNodes;
              for (var q = 0; q < nodes.length; q++) {
                if (nodes[q].nodeType === 3 && nodes[q].nodeValue.indexOf("数据只存 NAS") !== -1) {
                  nodes[q].nodeValue = nodes[q].nodeValue.replace(
                    "供微信小程序远程访问本机账本（数据只存 NAS，经你自己的内网穿透/公网地址转发）。 当前对外端口：",
                    "供微信小程序远程访问账本（数据存 Cloudflare D1，经你的 Worker 域名访问）。 当前对外端口："
                  );
                }
              }
            }
            var chains = document.querySelectorAll(".key-flow-chain");
            for (var c = 0; c < chains.length; c++) {
              if ((chains[c].textContent || "").indexOf("NAS") !== -1) {
                chains[c].textContent = "";
                chains[c].appendChild(document.createTextNode("微信小程序 → 你的 Cloudflare Worker（唯一存储）"));
              }
            }
          }

          // 常驻修补：React 重渲染（路由切换、接口密钥/备份状态变化等）会重建设置页 DOM，
          // 每次 DOM 变化都幂等检查一遍；不在设置页时查不到目标元素，开销可忽略。
          var mo = new MutationObserver(function () {
            mountButton();
            patchAccountText();
            patchKeyText();
          });
          var appRoot = document.getElementById("root") || document.body;
          mo.observe(appRoot, { childList: true, subtree: true });

          var start = function () {
            mountButton();
            // 定时兜底（防 observer 漏报或首渲染竞态；每次都是幂等检查）
            setInterval(mountButton, 800);
            setInterval(patchAccountText, 800);
            setInterval(patchKeyText, 3000);
          };

          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", start);
          } else {
            start();
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", buildAuthUI);
        } else {
          buildAuthUI();
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CHaro1Qz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-0wU_Pyvo.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
