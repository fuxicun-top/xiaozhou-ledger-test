name = "xiaozhou-ledger-web"
main = "src/index.js"
compatibility_date = "2026-11-14"

[[d1_databases]]
binding = "DB"
database_name = "xiaozhou-ledger-web"
database_id = "da712a6f-2511-41de-a4d2-cb9f6764c0b4"

# 静态前端由 Worker 直接托管（单域名）：/api/* 走 Worker，其余走静态资源
[assets]
directory = "www"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 注意：ADMIN_KEY / JWT_SECRET 等敏感变量【不写在 toml】（本仓库公开，提交会泄露）。
# 它们在 Cloudflare 后台以「加密 Secret」设置（Dash → Worker → Settings → Encrypted Secrets），
# 详见 README「第 4 步」。wrangler deploy 不会清除后台已设的加密 Secret。

[observability]
enabled = true
