# ============================================================
# 人情录 · Cloudflare Worker 配置文件
# 每个字段的含义见下方注释。敏感密钥（ADMIN_KEY/JWT_SECRET）
# 不写在本文件，而是在 Cloudflare 后台以「加密 Secret」设置。
# ============================================================

# ① Worker 名称：必须是全局唯一的标识，也是 CF 控制台里的项目名。
#    要改名需同步改「第 2 步」里 GitHub 仓库和 CI 构建的引用。
name = "xiaozhou-ledger-test"

# ② 入口文件：Worker 主程序（HTTP 请求进来执行的就是它）。
#    本项目所有 /api 路由、JWT 校验、D1 读写都在 src/index.js。
main = "src/index.js"

# ③ 兼容性日期：锁定 Worker 运行时行为版本（像 Node LTS）。
#    保持这个日期即可；升级 Cloudflare 新特性时才改。
#    不要随手升到 "latest"，可能引入未知行为变化。
compatibility_date = "2026-11-14"

# ④ D1 数据库绑定（可以写多个 [[d1_databases]]，本仓库只用一个）：
#    binding       —— 在代码里通过 env.DB 访问该库（见 src/index.js）。
#    database_name —— 库的"名字"，仅人类可读，实际以 database_id 为准。
#    database_id   —— D1 控制台创建库时给出的 UUID，决定连到哪份数据。
#    ⚠️ fork 本仓库的人【必须】把 database_id 换成自己库的 UUID，否则连到别人的库。
[[d1_databases]]
binding = "DB"
database_name = "xiaozhou-ledger-test"
database_id = "7ee69bcc-d5c8-4f41-8da4-5228142027bc"

# ⑤ 静态资源托管（单域名方案）：
#    Cloudflare Assets 把 www/ 下的文件当静态资源直接下发，不走 Worker 代码。
#    - directory          = "www"             静态根目录（含 index.html / assets / admin.html 等）。
#    - binding = "ASSETS"                     代码里用 env.ASSETS 读静态文件的句柄（本项目未主动用，保留以兼容）。
#    - not_found_handling = "single-page-application"
#        未匹配到的路径一律回落到 index.html（SPA 回退）；让 /xxx 深链也能打开前端。
#        可选值："none"（404）/ "single-page-application"（回落 index.html）。
#    - run_worker_first = ["/api/*"]          这些路径【先走 Worker 代码、再查静态】。
#        本项目的 /api/* 全部由 src/index.js 处理，不走静态；其余路径先查静态、查不到再落 SPA。
[assets]
directory = "www"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ⑥ 敏感变量（ADMIN_KEY / JWT_SECRET / MAX_ACCOUNTS / REGISTER_COOLDOWN_MINUTES）
#    —— 不在本文件里。原因：仓库公开，写进去=泄露。
#    敏感值（ADMIN_KEY/JWT_SECRET）：CF 后台「Encrypted Secrets」设，详见 README 第 4 步。
#    非敏感值（MAX_ACCOUNTS/REGISTER_COOLDOWN_MINUTES，可选）：可在本文件加 [vars] 段：
#      [vars]
#      MAX_ACCOUNTS = "100"
#      REGISTER_COOLDOWN_MINUTES = "60"
#    加密 Secret 不受 wrangler deploy 影响；明文 Variable 若不在 [vars] 里会被每次部署清掉。

# ⑦ 可观测性：开启后 CF 记录 Worker 日志/追踪。
#    免费版保留 7 天日志，方便排查；不需要可设 false。
[observability]
enabled = true
